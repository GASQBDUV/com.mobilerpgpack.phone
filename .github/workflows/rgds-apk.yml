name: RG DS APK

on:
  push:
    branches: [rgds]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      # The full native build (UZDoom + its third-party libs) needs the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK, NDK and CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          for pkg in "platforms;android-36" "platforms;android-36.1" "build-tools;37.0.0" \
              "ndk;29.0.14206865" "cmake;4.1.2"; do
            "$SDKM" "$pkg" > /dev/null || echo "::warning::sdkmanager could not install $pkg"
          done
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/cmake" "$ANDROID_HOME/ndk" "$ANDROID_HOME/build-tools"

      # arm64 only (the RG DS / RG DS Plus are arm64) to keep the build inside
      # the runner's time limit, and a throwaway signing key kept in the repo
      # so builds install over each other.
      - name: Configure build
        run: |
          sed -i "s/ext.abi_filters = .*/ext.abi_filters = ['arm64-v8a']/" build.gradle
          cat > release-keystore.properties <<PROPS
          storeFile=$GITHUB_WORKSPACE/rgds.keystore
          keyAlias=rgds
          keyPassword=android
          storePassword=android
          PROPS
          grep abi_filters build.gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          # Build logs aren't reachable from outside the runner, so on failure
          # surface the important lines as annotations.
          if ! ./gradlew --no-daemon :app:assembleFdroidRelease 2>&1 | tee build.log; then
            grep -E "What went wrong|error:|Error:|FAILED|Could not|not found|> " build.log \
              | grep -v "^> Task" | head -40 | sed 's/^/::error::/' || true
            exit 1
          fi
          find app/build/outputs/apk -name '*.apk' -exec cp {} doom-rgds.apk \;
          ls -la doom-rgds.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: rgds-build-${{ github.run_number }}
          name: RG DS build ${{ github.run_number }}
          files: doom-rgds.apk
